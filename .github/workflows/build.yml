# Builds both DLLs and runs the portable tests on every push and pull request.
# Build-only: releases are made by hand (see CHANGELOG.md), so nothing here publishes.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64

      - name: Build both DLLs and run the core tests
        run: ./build-mingw.sh

      - name: Upload the DLLs
        uses: actions/upload-artifact@v4
        with:
          name: LinerNotes-dlls
          path: dist/*.dll
          if-no-files-found: error
